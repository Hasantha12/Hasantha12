<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#00f7ff"><animate attributeName="stop-color" values="#00f7ff;#7c3aed;#ff007f;#00f7ff" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#ff007f"><animate attributeName="stop-color" values="#ff007f;#00f7ff;#7c3aed;#ff007f" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
</defs>
<rect x="2" y="2" width="896" height="176" rx="20" fill="#030712" stroke="url(#bd)" stroke-width="2.5"/>
<text x="40" y="112" font-family="Georgia,serif" font-size="110" fill="#7c3aed" opacity=".35">“</text>
<text x="860" y="150" text-anchor="end" font-family="Georgia,serif" font-size="110" fill="#00f7ff" opacity=".2">”</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0300;0.2200;0.2500;1.0000" dur="28s" repeatCount="indefinite"/><text x="450.0" y="78" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="23" font-style="italic" fill="#e2e8f0">Talk is cheap. Show me the code.</text>
<text x="450.0" y="138" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" letter-spacing="3" fill="#00f7ff">- LINUS TORVALDS</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2500;0.2800;0.4700;0.5000;1.0000" dur="28s" repeatCount="indefinite"/><text x="450.0" y="66" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="23" font-style="italic" fill="#e2e8f0">Programs must be written for people to read,</text><text x="450.0" y="98" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="23" font-style="italic" fill="#e2e8f0">and only incidentally for machines to execute.</text>
<text x="450.0" y="138" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" letter-spacing="3" fill="#00f7ff">- HAROLD ABELSON</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5000;0.5300;0.7200;0.7500;1.0000" dur="28s" repeatCount="indefinite"/><text x="450.0" y="78" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="23" font-style="italic" fill="#e2e8f0">Simplicity is prerequisite for reliability.</text>
<text x="450.0" y="138" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" letter-spacing="3" fill="#00f7ff">- EDSGER W. DIJKSTRA</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7500;0.7800;0.9700;1.0000" dur="28s" repeatCount="indefinite"/><text x="450.0" y="78" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="23" font-style="italic" fill="#e2e8f0">Make it work, make it right, make it fast.</text>
<text x="450.0" y="138" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" letter-spacing="3" fill="#00f7ff">- KENT BECK</text></g>
<circle cx="420.0" cy="162" r="4" fill="#334155"/><circle cx="420.0" cy="162" r="4" fill="#00f7ff" opacity="0" filter="none"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0010;0.2500;0.2510;1.0000" dur="28s" repeatCount="indefinite"/></circle>
<circle cx="440.0" cy="162" r="4" fill="#334155"/><circle cx="440.0" cy="162" r="4" fill="#00f7ff" opacity="0" filter="none"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2500;0.2510;0.5000;0.5010;1.0000" dur="28s" repeatCount="indefinite"/></circle>
<circle cx="460.0" cy="162" r="4" fill="#334155"/><circle cx="460.0" cy="162" r="4" fill="#00f7ff" opacity="0" filter="none"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5000;0.5010;0.7500;0.7510;1.0000" dur="28s" repeatCount="indefinite"/></circle>
<circle cx="480.0" cy="162" r="4" fill="#334155"/><circle cx="480.0" cy="162" r="4" fill="#00f7ff" opacity="0" filter="none"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7500;0.7510;1.0000" dur="28s" repeatCount="indefinite"/></circle>
