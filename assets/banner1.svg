<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030712"/><stop offset=".55" stop-color="#0b1220"/><stop offset="1" stop-color="#14123a"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<!-- name: clean white with a soft light sweep (no colour cycling) -->
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
<stop offset="0" stop-color="#e2e8f0"/><stop offset=".42" stop-color="#e2e8f0"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".58" stop-color="#e2e8f0"/><stop offset="1" stop-color="#e2e8f0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1000 0;1000 0;1000 0" keyTimes="0;.6;1" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".10"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".07"/></pattern>
<filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<clipPath id="clip"><rect width="1000" height="300" rx="20"/></clipPath>
