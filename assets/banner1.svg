<rect x="1" y="1" width="998" height="298" rx="20" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="60 940"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="8s" repeatCount="indefinite"/></rect>
