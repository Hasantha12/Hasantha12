<svg width="1000" height="10" viewBox="0 0 1000 10" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#00f7ff"/><stop offset=".33" stop-color="#7c3aed"/><stop offset=".66" stop-color="#ff007f"/><stop offset="1" stop-color="#00f7ff"/>
